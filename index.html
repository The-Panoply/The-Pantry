<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fbfaf6">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1c211e">
  <meta name="description" content="Le Garde-Manger — recipes, weekly meals, and groceries.">
  <title>Le Garde-Manger — The Panoply</title>
  <meta name="apple-mobile-web-app-title" content="Garde-Manger">
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./styles.css?v=20261115-top-edge">
  <script defer src="./app.js"></script>
</head>
<body>
  <a class="skip" href="#main">Skip to meals</a>
  <header class="masthead">
    <div class="shell">
      <div class="brand-panel">
        <a class="panoply-label" href="https://github.com/The-Panoply" aria-label="The Panoply">THE PANOPLY</a>
        <h1 class="wordmark" aria-label="Le Garde-Manger">
          <span class="wordmark-le" aria-hidden="true">Le</span>
          <span class="wordmark-name" aria-hidden="true">Garde-Manger</span>
        </h1>
        <div class="ornament" aria-hidden="true"><span class="ornament-rule"></span><span class="ornament-flourish">❧</span><span class="ornament-rule"></span></div>
      </div>
      <nav class="tabs" aria-label="Pantry sections">
        <button type="button" class="tab active" data-tab="week" aria-current="page">This Week</button>
        <button type="button" class="tab" data-tab="saved">Saved Recipes</button>
        <button type="button" class="tab" data-tab="groceries">Groceries</button>
      </nav>
    </div>
  </header>
  <main class="shell" id="main">
    <section id="panel-week" class="panel" aria-labelledby="week-label">
      <div class="section-heading">
        <div>
          <p id="week-label" class="eyebrow"></p>
        </div>
        <div class="selection-count"><strong id="pick-count">0</strong><span>selected</span></div>
      </div>
      <div id="recipe-grid" class="recipe-grid" aria-live="polite"></div>
      <section class="your-menu" aria-labelledby="menu-heading">
        <div class="menu-heading">
          <div>
            <h2 id="menu-heading">Your Menu</h2>
            <p>Chosen dinners appear here.</p>
          </div>
          <button type="button" id="clear-picks" class="text-action" hidden>Clear</button>
        </div>
        <div id="selected-list" aria-live="polite"><p class="empty-state">No meals selected.</p></div>
      </section>
    </section>
    <section id="panel-saved" class="panel" aria-label="Saved Recipes" hidden>
      <div class="saved-collections" role="group" aria-label="Recipe collections">
        <button type="button" class="collection-filter active" data-collection="home-chef-favorites" aria-pressed="true">Home Chef Favorites <span class="collection-total" id="home-chef-count"></span></button>
        <button type="button" class="collection-filter" data-collection="apple-news" aria-pressed="false">Apple News <span class="collection-total" id="apple-news-count"></span></button>
        <button type="button" class="collection-filter" data-collection="all" aria-pressed="false">All <span class="collection-total" id="all-saved-count"></span></button>
      </div>
      <div class="saved-tools">
        <label class="visually-hidden" for="saved-search">Search recipes</label>
        <input id="saved-search" type="search" placeholder="Search recipes" autocomplete="off">
        <label class="visually-hidden" for="saved-publisher">Filter by publisher</label>
        <select id="saved-publisher" aria-label="Publisher"><option value="">All publishers</option></select>
        <span id="saved-count" class="saved-count"></span>
      </div>
      <div id="saved-list" class="saved-list"></div>
    </section>
    <section id="panel-groceries" class="panel" aria-label="Groceries" hidden>
      <div class="grocery-layout">
        <div class="grocery-section"><h2>Selected Meals</h2><div id="grocery-meals"></div></div>
        <div class="grocery-section"><h2>Shopping List</h2><p class="muted">Ingredient lists will be available after the recipes are verified. Nothing has been added to a shopping cart.</p></div>
      </div>
    </section>
  </main>
  <footer class="footer shell"><span>THE PANOPLY</span><span>Le Garde-Manger</span></footer>
</body>
</html>
