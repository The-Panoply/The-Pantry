<!doctype html>
<html lang="en">

<title>Le Garde-Manger — Approved Wordmark Reference</title>
<style>
body{background:#faf9f6;margin:0;padding:22px;box-sizing:border-box}
.frame{max-width:620px;margin:0 auto}
.note{font:12px -apple-system,BlinkMacSystemFont,sans-serif;color:#777;margin:18px auto;max-width:620px}
.panoply{font:600 6.5px/1.5 -apple-system,BlinkMacSystemFont,sans-serif;letter-spacing:3.2px;color:rgba(171,137,87,.43);margin-bottom:21px}
.le{font:italic 40px/1 'Bodoni 72','Didot','Baskerville',Georgia,serif;color:#b18a55;margin-bottom:-4px}
.name{font:400 clamp(37px,7.4vw,68px)/1.12 'Didot','Bodoni 72','Baskerville',Georgia,serif;letter-spacing:-1.5px}
@media(max-width:570px){.panoply{font-size:6px;letter-spacing:2.8px;margin-bottom:16px}.le{font-size:32px}.name{font-size:clamp(28px,7.8vw,35px);letter-spacing:-1.2px}}

<div class="frame">
  <div style="background:#f8f6ef;border:1px solid #e7e0d3;border-radius:13px;padding:32px 16px;text-align:center;color:#253d35">

    <div class="le">Le</div>
    <div class="name">Garde-Manger</div>
    <div style="display:flex;align-items:center;justify-content:center;gap:12px;margin-top:18px;color:#ae8c5a">
      <span style="width:64px;height:1px;background:#c9ae82"></span><span style="font:25px Georgia,serif">❧</span><span style="width:64px;height:1px;background:#c9ae82"></span>
    </div>
  </div>

<p class="note">Approved design reference. The historic first mockup is preserved in BRAND_BASELINE.md, with the two subsequently approved adjustments: fainter, smaller Panoply; reduced mobile title size.</p>
